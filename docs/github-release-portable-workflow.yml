name: Build & Publish Portable Release (win-x64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag of an existing GitHub Release to attach the build to (for example v2.1.0)"
        required: true
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-portable-win-x64:
    name: Build self-contained single-file portable (.zip)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_TAG: ${{ github.event.inputs.release_tag || github.event.release.tag_name }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Check that the release exists
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_TAG)) { Write-Host "::error::Release tag is empty"; exit 1 }
          gh release view $env:RELEASE_TAG --json tagName | Out-Null
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::Release $($env:RELEASE_TAG) was not found. Create the release first."; exit 1 }

      - name: Run tests and build the portable archive
        shell: pwsh
        run: |
          $ver = $env:RELEASE_TAG.TrimStart('v')
          ./scripts/build-portable-release.ps1 -Version $ver -Runtime win-x64 -ReleaseTag $env:RELEASE_TAG

      - name: Upload the archive and checksums to the release
        shell: pwsh
        run: gh release upload $env:RELEASE_TAG artifacts/*.zip artifacts/SHA256SUMS-*.txt --clobber
