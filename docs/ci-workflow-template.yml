name: CI

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (.NET 10, Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        shell: pwsh
        run: |
          try { if (Test-Path ./scripts/ci.ps1) { ./scripts/ci.ps1 -Step Build } else { dotnet build UltimateWindows.sln -c Release } }
          catch { Write-Host ("::error title=ci.ps1::" + ("$_" -replace "\r?\n", "%0A")); exit 1 }
      - name: Test
        shell: pwsh
        run: |
          try { if (Test-Path ./scripts/ci.ps1) { ./scripts/ci.ps1 -Step Test } else { dotnet test UltimateWindows.sln -c Release --no-build } }
          catch { Write-Host ("::error title=ci.ps1::" + ("$_" -replace "\r?\n", "%0A")); exit 1 }
      - name: Portable build check (no upload)
        shell: pwsh
        run: |
          try { if (Test-Path ./scripts/ci.ps1) { ./scripts/ci.ps1 -Step Publish } else { Write-Host "skipped" } }
          catch { Write-Host ("::error title=ci.ps1::" + ("$_" -replace "\r?\n", "%0A")); exit 1 }
