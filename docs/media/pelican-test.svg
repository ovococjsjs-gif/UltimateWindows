  <!-- Дорога -->
  <rect x="0" y="520" width="800" height="80" fill="url(#road)"/>
  <path d="M0 520 H800" stroke="#c9bfab" stroke-width="3"/>
  <g stroke="#cfc5b1" stroke-width="5" stroke-linecap="round" stroke-dasharray="34 26">
    <line x1="0" y1="572" x2="800" y2="572"/>
