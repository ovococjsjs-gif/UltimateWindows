  <g>
    <circle cx="610" cy="430" r="88" fill="none" stroke="#2b2f36" stroke-width="12"/>
    <circle cx="610" cy="430" r="76" fill="none" stroke="#c4ccd4" stroke-width="3"/>
    <g stroke="#9aa3ad" stroke-width="1.6" stroke-linecap="round">
      <line x1="610.0" y1="430.0" x2="684.0" y2="430.0" />
      <line x1="610.0" y1="430.0" x2="681.5" y2="449.2" />
      <line x1="610.0" y1="430.0" x2="674.1" y2="467.0" />
      <line x1="610.0" y1="430.0" x2="662.3" y2="482.3" />
      <line x1="610.0" y1="430.0" x2="647.0" y2="494.1" />
      <line x1="610.0" y1="430.0" x2="629.2" y2="501.5" />
      <line x1="610.0" y1="430.0" x2="610.0" y2="504.0" />
      <line x1="610.0" y1="430.0" x2="590.8" y2="501.5" />
      <line x1="610.0" y1="430.0" x2="573.0" y2="494.1" />
      <line x1="610.0" y1="430.0" x2="557.7" y2="482.3" />
      <line x1="610.0" y1="430.0" x2="545.9" y2="467.0" />
      <line x1="610.0" y1="430.0" x2="538.5" y2="449.2" />
      <line x1="610.0" y1="430.0" x2="536.0" y2="430.0" />
      <line x1="610.0" y1="430.0" x2="538.5" y2="410.8" />
      <line x1="610.0" y1="430.0" x2="545.9" y2="393.0" />
      <line x1="610.0" y1="430.0" x2="557.7" y2="377.7" />
      <line x1="610.0" y1="430.0" x2="573.0" y2="365.9" />
      <line x1="610.0" y1="430.0" x2="590.8" y2="358.5" />
      <line x1="610.0" y1="430.0" x2="610.0" y2="356.0" />
      <line x1="610.0" y1="430.0" x2="629.2" y2="358.5" />
      <line x1="610.0" y1="430.0" x2="647.0" y2="365.9" />
      <line x1="610.0" y1="430.0" x2="662.3" y2="377.7" />
      <line x1="610.0" y1="430.0" x2="674.1" y2="393.0" />
      <line x1="610.0" y1="430.0" x2="681.5" y2="410.8" />
    </g>
    <circle cx="610" cy="430" r="10" fill="#8b949e" stroke="#5b636b" stroke-width="2"/>
  </g>

  <!-- Рама -->
  <g fill="none" stroke="url(#frame)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 430 L430 440"/>          <!-- нижние перья -->
    <path d="M250 430 L362 296"/>         <!-- верхние перья -->
    <path d="M362 296 L430 440"/>                     <!-- подседельная труба -->
    <path d="M362 296 L568 302"/>                     <!-- верхняя труба -->
    <path d="M568 302 L430 440"/>                     <!-- нижняя труба -->
    <path d="M568 302 L610 430"/>       <!-- вилка -->
  </g>
  <g fill="none" stroke="#1a7568" stroke-width="7" stroke-linecap="round">
    <path d="M362 296 L352 268"/>
    <path d="M568 302 L574 268"/>
  </g>

  <!-- Седло -->
  <path d="M318 262 C332 250 372 250 384 262 C388 276 356 284 336 282 C322 280 314 272 318 262 Z"
        fill="#3a3f47"/>
  <path d="M322 266 C338 258 366 257 378 264" stroke="#5b626b" stroke-width="3" fill="none"/>

  <!-- Руль -->
  <g fill="none" stroke="#3a3f47" stroke-width="9" stroke-linecap="round">
    <path d="M574 268 L582 250"/>
    <path d="M540 246 C562 236 586 240 600 252"/>
  </g>
  <circle cx="601" cy="252" r="7" fill="#e07a5f" stroke="#b5553d" stroke-width="2"/>
  <circle cx="540" cy="246" r="7" fill="#e07a5f" stroke="#b5553d" stroke-width="2"/>
  <g fill="#d9dee3" stroke="#a9b1b8" stroke-width="2">
