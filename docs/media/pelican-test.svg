<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Пеликан едет на велосипеде">
  <title>Пеликан на велосипеде</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6f7"/>
      <stop offset="0.55" stop-color="#ddf1fb"/>
      <stop offset="1" stop-color="#f7fbfd"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3bd" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff3bd" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f6f2e8"/>
      <stop offset="1" stop-color="#e3ddd0"/>
    </linearGradient>
    <linearGradient id="beak" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffc45c"/>
      <stop offset="1" stop-color="#ef9a1e"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0" y1="0" x2="0.2" y2="1">
      <stop offset="0" stop-color="#f7a53a"/>
      <stop offset="1" stop-color="#e07a12"/>
    </linearGradient>
    <linearGradient id="frame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#37b3a2"/>
      <stop offset="1" stop-color="#1f8b7d"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#efe9dd"/>
      <stop offset="1" stop-color="#ded6c6"/>
    </linearGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c6e7d3"/>
      <stop offset="1" stop-color="#b2dcc4"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d9b6"/>
      <stop offset="1" stop-color="#8fcda2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Небо и солнце -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="688" cy="104" r="96" fill="url(#sunGlow)"/>
  <circle cx="688" cy="104" r="42" fill="#ffe9a6"/>

  <!-- Облака -->
  <g fill="#ffffff" opacity="0.92">
    <ellipse cx="140" cy="120" rx="58" ry="26"/>
    <ellipse cx="182" cy="104" rx="40" ry="30"/>
    <ellipse cx="98" cy="108" rx="34" ry="22"/>
    <ellipse cx="470" cy="76" rx="44" ry="20"/>
    <ellipse cx="502" cy="66" rx="30" ry="24"/>
  </g>

  <!-- Дальние холмы -->
  <path d="M0 520 V455 C60 415 120 402 190 432 C250 458 300 432 360 404 C430 371 500 392 560 424 C620 456 690 448 800 402 V520 Z"
        fill="url(#hillFar)"/>
  <path d="M0 520 V487 C70 462 140 470 205 490 C275 511 330 500 400 478 C470 456 540 470 610 492 C690 517 740 512 800 486 V520 Z"
