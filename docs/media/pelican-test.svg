    <circle cx="430" cy="440" r="16" fill="#c4ccd4" stroke="#8b949e" stroke-width="3"/>
    <line x1="430" y1="440" x2="404" y2="472" stroke="#8b949e" stroke-width="9" stroke-linecap="round"/>
    <rect x="384" y="468" width="42" height="12" rx="5" fill="#3a3f47"/>
    <line x1="430" y1="440" x2="452" y2="410" stroke="#adb5bd" stroke-width="9" stroke-linecap="round"/>
    <rect x="440" y="398" width="26" height="10" rx="4" fill="#5b626b" opacity="0.8"/>
    <circle cx="430" cy="440" r="6" fill="#6b737b"/>
  </g>
  <g fill="none" stroke="#9aa3ad" stroke-width="3">
    <path d="M430 452 C400 456 350 452 300 448"/>
  </g>

  <!-- Дальняя лапа (за телом) -->
  <g stroke="#c9791d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.95">
    <path d="M352 300 L368 376 L444 404"/>
  </g>
  <path d="M434 400 C446 395 464 397 470 403 C472 409 466 416 452 417 C438 418 430 411 430 405 Z"
        fill="#d1852a" stroke="#a75f12" stroke-width="2"/>

  <!-- Пеликан -->
  <g>
    <!-- Хвост -->
    <path d="M258 246 C226 232 206 236 194 250 C212 258 240 268 262 272 Z" fill="#efe9dc" stroke="#cfc7b6" stroke-width="3"/>
    <path d="M232 254 C216 250 204 252 198 258" stroke="#cfc7b6" stroke-width="2.5" fill="none"/>

    <!-- Тело -->
    <ellipse cx="352" cy="246" rx="112" ry="82" transform="rotate(-9 352 246)"
             fill="url(#body)" stroke="#cfc7b6" stroke-width="3"/>

    <!-- Шея -->
    <path d="M410 200 C432 158 470 132 512 126 L524 166 C488 176 452 200 428 232 Z"
          fill="url(#body)" stroke="#cfc7b6" stroke-width="3" stroke-linejoin="round"/>

    <!-- Голова -->
    <circle cx="527" cy="130" r="43" fill="url(#body)" stroke="#cfc7b6" stroke-width="3"/>
    <!-- Хохолок -->
    <path d="M502 96 C492 84 496 70 508 72 C506 80 508 88 512 94 Z" fill="#efe9dc" stroke="#cfc7b6" stroke-width="2.5"/>
    <path d="M514 88 C508 74 518 64 528 70 C522 76 520 84 522 90 Z" fill="#efe9dc" stroke="#cfc7b6" stroke-width="2.5"/>

    <!-- Клюв: надклювье -->
    <path d="M560 108 C620 114 668 128 706 146 C710 150 708 156 702 157 C660 150 610 144 560 138 Z"
          fill="url(#beak)" stroke="#c97f16" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Клюв: мешок -->
    <path d="M562 136 C580 176 618 192 654 184 C682 178 700 164 704 156 C662 150 610 144 562 136 Z"
          fill="url(#pouch)" stroke="#c97f16" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M580 150 C600 172 626 180 650 176" stroke="#c97f16" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- Ноздря -->
    <line x1="588" y1="118" x2="608" y2="122" stroke="#c97f16" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Глаз -->
    <circle cx="536" cy="118" r="7.5" fill="#2b2f36"/>
    <circle cx="538.5" cy="115.5" r="2.6" fill="#ffffff"/>
    <circle cx="536" cy="118" r="11" fill="none" stroke="#e2b480" stroke-width="2" opacity="0.8"/>

    <!-- Крыло (сложенное) -->
    <path d="M292 208 C330 186 392 194 436 226 C452 238 458 252 452 268 C420 282 366 280 330 262 C304 249 284 230 292 208 Z"
          fill="#f7f3ea" stroke="#cfc7b6" stroke-width="3"/>
    <g stroke="#cfc7b6" stroke-width="2.2" fill="none" opacity="0.9">
      <path d="M320 214 C348 216 380 228 402 244"/>
      <path d="M308 232 C336 236 366 246 392 262"/>
      <path d="M348 240 C374 246 400 258 424 268"/>
    </g>

    <!-- Крыло-рука на руле -->
    <path d="M404 246 C452 250 512 262 552 276 C566 281 574 286 578 292 L566 306 C540 298 486 288 436 280 C412 276 396 262 404 246 Z"
          fill="#f7f3ea" stroke="#cfc7b6" stroke-width="3" stroke-linejoin="round"/>
    <path d="M556 280 C566 278 576 282 578 290 C580 298 572 304 560 302 C552 300 548 292 552 286 Z"
          fill="#f7f3ea" stroke="#cfc7b6" stroke-width="2.5"/>

    <!-- Ближняя лапа на педали -->
    <g stroke="#e08a2b" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M378 300 L392 372 L404 452"/>
    </g>
    <path d="M384 450 C398 443 426 443 440 450 C444 458 438 467 419 469 C400 471 386 465 382 457 Z"
          fill="#e89a3c" stroke="#c4761d" stroke-width="2.5"/>
    <g stroke="#c4761d" stroke-width="2" fill="none" opacity="0.85">
      <path d="M395 451 L401 466"/>
      <path d="M411 449 L413 467"/>
      <path d="M426 450 L423 465"/>
    </g>
  </g>
</svg>
