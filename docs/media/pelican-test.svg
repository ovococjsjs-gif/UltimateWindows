    <circle cx="150" cy="500" r="7"/>
    <circle cx="96" cy="500" r="5"/>
  </g>

  <ellipse cx="430" cy="524" rx="300" ry="12" fill="#b9ae98" opacity="0.35" filter="url(#soft)"/>

  <!-- Заднее колесо -->
  <g>
    <circle cx="250" cy="430" r="88" fill="none" stroke="#2b2f36" stroke-width="12"/>
    <circle cx="250" cy="430" r="76" fill="none" stroke="#c4ccd4" stroke-width="3"/>
    <g stroke="#9aa3ad" stroke-width="1.6" stroke-linecap="round">
      <line x1="250.0" y1="430.0" x2="324.0" y2="430.0" />
      <line x1="250.0" y1="430.0" x2="321.5" y2="449.2" />
      <line x1="250.0" y1="430.0" x2="314.1" y2="467.0" />
      <line x1="250.0" y1="430.0" x2="302.3" y2="482.3" />
      <line x1="250.0" y1="430.0" x2="287.0" y2="494.1" />
      <line x1="250.0" y1="430.0" x2="269.2" y2="501.5" />
      <line x1="250.0" y1="430.0" x2="250.0" y2="504.0" />
      <line x1="250.0" y1="430.0" x2="230.8" y2="501.5" />
      <line x1="250.0" y1="430.0" x2="213.0" y2="494.1" />
      <line x1="250.0" y1="430.0" x2="197.7" y2="482.3" />
      <line x1="250.0" y1="430.0" x2="185.9" y2="467.0" />
      <line x1="250.0" y1="430.0" x2="178.5" y2="449.2" />
      <line x1="250.0" y1="430.0" x2="176.0" y2="430.0" />
      <line x1="250.0" y1="430.0" x2="178.5" y2="410.8" />
      <line x1="250.0" y1="430.0" x2="185.9" y2="393.0" />
      <line x1="250.0" y1="430.0" x2="197.7" y2="377.7" />
      <line x1="250.0" y1="430.0" x2="213.0" y2="365.9" />
      <line x1="250.0" y1="430.0" x2="230.8" y2="358.5" />
      <line x1="250.0" y1="430.0" x2="250.0" y2="356.0" />
      <line x1="250.0" y1="430.0" x2="269.2" y2="358.5" />
      <line x1="250.0" y1="430.0" x2="287.0" y2="365.9" />
      <line x1="250.0" y1="430.0" x2="302.3" y2="377.7" />
      <line x1="250.0" y1="430.0" x2="314.1" y2="393.0" />
