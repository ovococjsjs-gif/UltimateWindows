<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="title desc">
  <title id="title">Пеликан на велосипеде</title>
  <desc id="desc">Векторная иллюстрация: белый пеликан едет на бирюзовом велосипеде.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf7fc"/>
      <stop offset="0.62" stop-color="#cbeaf4"/>
      <stop offset="1" stop-color="#b6e2ee"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.65" stop-color="#f3f8fa"/>
      <stop offset="1" stop-color="#dfeaef"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#fbfdfe"/>
      <stop offset="1" stop-color="#e4eef2"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#f0952f"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#ffcb76"/>
      <stop offset="1" stop-color="#ee9134"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#2b93a8"/>
      <stop offset="1" stop-color="#15637a"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe6a1" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffd36e" stop-opacity="0.35"/>
    </radialGradient>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#4a7f92" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- ================= ФОН ================= -->
  <rect width="900" height="700" fill="url(#sky)"/>

  <circle cx="742" cy="152" r="112" fill="url(#sunG)"/>
  <circle cx="742" cy="152" r="58" fill="#ffd977"/>

  <g fill="#ffffff" opacity="0.9">
    <path d="M118 148c14-26 52-28 66-4 22-8 44 6 44 24H96c0-12 10-20 22-20z"/>
    <path d="M520 96c10-19 38-20 48-3 16-6 32 5 32 18h-96c0-9 7-15 16-15z"/>
    <path d="M356 190c8-15 30-16 38-2 13-5 26 4 26 14h-76c0-7 5-12 12-12z" opacity="0.75"/>
  </g>

  <path d="M0 470c120-52 196-16 268 4 74 21 122-24 206-30 96-7 176 34 268 22 56-7 108-2 158 12v222H0z" fill="#c4e8db"/>
  <path d="M0 512c96-40 164-8 240 10 86 20 142-22 226-24 92-2 168 34 254 24 64-8 128-4 180 10v168H0z" fill="#a9dcc6"/>
  <path d="M0 566c118-26 200 8 292 10 104 2 168-24 260-20 112 4 236 26 348 12v132H0z" fill="#8fcfb4"/>

  <!-- тень под велосипедом -->
  <ellipse cx="452" cy="596" rx="238" ry="26" fill="#6cb898" opacity="0.55"/>
  <ellipse cx="452" cy="596" rx="150" ry="16" fill="#57a988" opacity="0.35"/>

  <!-- линии движения -->
  <g stroke="#ffffff" stroke-width="9" stroke-linecap="round" opacity="0.75">
    <path d="M116 452h62"/>
    <path d="M92 500h44"/>
    <path d="M124 548h58"/>
  </g>

  <!-- ================= ДАЛЬНЯЯ НОГА И ПЕДАЛЬ ================= -->
  <path d="M450 490 422 456" stroke="#2b3a42" stroke-width="10" stroke-linecap="round"/>
  <rect x="404" y="448" width="34" height="12" rx="6" fill="#2b3a42" transform="rotate(-28 421 454)"/>
  <path d="M384 342c3 26 10 46 20 61 6 9 10 16 12 24" fill="none" stroke="#c0782a" stroke-width="10" stroke-linecap="round"/>
  <path d="M398 434c8-5 20-4 26 1l7 6c2 2 1 5-2 5l-11 2c-7 1-14 0-18-4-4-4-6-6-2-10z" fill="#cd7d24"/>

  <!-- ================= КОЛЁСА ================= -->
  <g>
    <!-- заднее -->
    <circle cx="300" cy="480" r="106" fill="none" stroke="#2b3a42" stroke-width="17"/>
    <circle cx="300" cy="480" r="89" fill="none" stroke="#d7e6ec" stroke-width="7"/>
    <g transform="translate(300 480)" stroke="#a9c2cc" stroke-width="3" stroke-linecap="round">
      <path d="M0-85V85"/><path d="M0-85V85" transform="rotate(30)"/>
      <path d="M0-85V85" transform="rotate(60)"/><path d="M0-85V85" transform="rotate(90)"/>
      <path d="M0-85V85" transform="rotate(120)"/><path d="M0-85V85" transform="rotate(150)"/>
    </g>
    <circle cx="300" cy="480" r="12" fill="#2b3a42"/>
    <circle cx="300" cy="480" r="5" fill="#d7e6ec"/>

    <!-- переднее -->
    <circle cx="600" cy="480" r="106" fill="none" stroke="#2b3a42" stroke-width="17"/>
    <circle cx="600" cy="480" r="89" fill="none" stroke="#d7e6ec" stroke-width="7"/>
    <g transform="translate(600 480)" stroke="#a9c2cc" stroke-width="3" stroke-linecap="round">
      <path d="M0-85V85" transform="rotate(15)"/><path d="M0-85V85" transform="rotate(45)"/>
      <path d="M0-85V85" transform="rotate(75)"/><path d="M0-85V85" transform="rotate(105)"/>
      <path d="M0-85V85" transform="rotate(135)"/><path d="M0-85V85" transform="rotate(165)"/>
    </g>
    <circle cx="600" cy="480" r="12" fill="#2b3a42"/>
    <circle cx="600" cy="480" r="5" fill="#d7e6ec"/>
  </g>

  <!-- ================= ЦЕПЬ И ЗВЕЗДА ================= -->
  <g stroke="#2b3a42" stroke-width="4" fill="none" opacity="0.9">
    <path d="M450 466 305 470"/>
    <path d="M452 514 305 492"/>
  </g>
  <circle cx="450" cy="490" r="26" fill="none" stroke="#2b3a42" stroke-width="7"/>
  <g stroke="#2b3a42" stroke-width="3">
    <path d="M450 466v48" transform="rotate(0 450 490)"/>
    <path d="M450 466v48" transform="rotate(45 450 490)"/>
    <path d="M450 466v48" transform="rotate(90 450 490)"/>
    <path d="M450 466v48" transform="rotate(135 450 490)"/>
  </g>
  <circle cx="300" cy="480" r="9" fill="#2b3a42"/>

  <!-- ================= РАМА ================= -->
  <g fill="none" stroke="url(#frameG)" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M450 490 300 480"/>
    <path d="M392 352 300 480"/>
    <path d="M450 490 392 352"/>
    <path d="M392 352h164"/>
    <path d="M450 490 566 372"/>
    <path d="M556 350l10 22"/>
  </g>
  <!-- вилка -->
  <path d="M562 362 600 480" fill="none" stroke="url(#frameG)" stroke-width="12" stroke-linecap="round"/>

  <!-- подседельный штырь и седло -->
  <path d="M392 352v-18" stroke="#2b3a42" stroke-width="11" stroke-linecap="round"/>
  <path d="M344 342c8-12 40-18 62-14 20 4 44 8 48 14 3 5-6 8-20 9-30 2-64 2-80 0-10-1-14-4-10-9z" fill="#2b3a42"/>

  <!-- руль -->
  <path d="M558 344c-2-12 0-20 6-28" fill="none" stroke="#2b3a42" stroke-width="11" stroke-linecap="round"/>
  <path d="M560 318c26-8 52 0 58 18 4 12-2 20-12 24" fill="none" stroke="#2b3a42" stroke-width="11" stroke-linecap="round"/>
  <circle cx="606" cy="358" r="7" fill="#2b3a42"/>
  <!-- тормозная ручка -->
  <path d="M596 344c8 6 8 14 2 18" fill="none" stroke="#9fb6bf" stroke-width="4" stroke-linecap="round"/>
  <!-- педаль передняя -->
  <path d="M450 490l30 36" stroke="#2b3a42" stroke-width="12" stroke-linecap="round"/>
  <rect x="456" y="518" width="44" height="14" rx="7" fill="#2b3a42" transform="rotate(10 478 525)"/>
  <rect x="466" y="517" width="24" height="5" rx="2.5" fill="#f2f6f8" transform="rotate(10 478 525)" opacity="0.55"/>

  <!-- ================= ПЕЛИКАН ================= -->
  <!-- хвост -->
  <path d="M330 286c-22-8-42-4-56 8 16 6 30 14 40 24 8-10 14-20 16-32z" fill="#e6eff3" stroke="#cddbe2" stroke-width="2"/>
  <path d="M326 300c-16-4-30 0-40 8 12 4 22 10 30 18 6-8 9-17 10-26z" fill="#d4e2e9"/>

  <!-- дальнее крыло -->
  <path d="M392 250c-30 6-52 22-64 40 22 4 44-2 60-14 10-8 16-18 18-26z" fill="#dde9ee"/>

  <!-- тело -->
  <ellipse cx="392" cy="298" rx="78" ry="56" fill="url(#bodyG)" transform="rotate(-6 392 298)"/>

  <!-- шея -->
  <path d="M446 292c8-42 12-72 48-92" fill="none" stroke="url(#bodyG)" stroke-width="48" stroke-linecap="round"/>
  <path d="M446 292c8-42 12-72 48-92" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round" opacity="0.55"/>

  <!-- клюв (база уходит под голову) -->
  <g>
    <path d="M504 152C562 156 636 172 666 185c12 4 13 14 1 15-22 46-101 52-129 16-8-11-30-36-34-64z" fill="url(#pouchG)"/>
    <path d="M504 152C562 156 636 172 666 185c12 4 13 14 1 15-28 1-107-8-159-24-4-2-6-12-4-24z" fill="url(#beakG)"/>
    <path d="M508 177c58 14 132 23 160 22" fill="none" stroke="#d98320" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M548 204c10 18 30 25 52 20" fill="none" stroke="#e0821f" stroke-width="3.5" stroke-linecap="round" opacity="0.3"/>
    <path d="M655 186c12 2 18 9 17 15-1 5-7 7-12 5" fill="none" stroke="#d97d1b" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- голова -->
  <circle cx="502" cy="184" r="38" fill="#ffffff"/>
  <path d="M482 156c-10-13-26-18-37-16 7 9 10 18 10 25 9-6 19-9 27-9z" fill="#eef5f8"/>

  <!-- глаз -->
  <circle cx="512" cy="172" r="8.5" fill="#274049"/>
  <circle cx="515" cy="169" r="2.8" fill="#ffffff"/>
  <!-- румянец -->
  <ellipse cx="494" cy="204" rx="9" ry="5" fill="#f6b0a2" opacity="0.55"/>

  <!-- ближнее крыло, лежит на руле -->
  <path d="M398 266c46-10 118 12 168 44l14 10-18 12c-14 2-32-2-52-8-36-11-74-14-100-24-16-6-22-14-12-34z" fill="url(#wingG)"/>
  <path d="M398 266c46-10 118 12 168 44l14 10-18 12c-14 2-32-2-52-8-36-11-74-14-100-24-16-6-22-14-12-34z" fill="none" stroke="#cfdde4" stroke-width="3" stroke-linejoin="round"/>
  <g fill="none" stroke="#b9cdd6" stroke-width="3.5" stroke-linecap="round">
    <path d="M432 282c34 4 74 18 104 32"/>
    <path d="M440 300c32 6 70 18 96 30"/>
  </g>
  <!-- чёрные кончики маховых -->
  <path d="M566 320c14 6 30 10 44 8-8 10-24 14-38 10z" fill="#37505c"/>
  <path d="M540 312c12 8 26 12 40 12-8 10-22 12-36 8z" fill="#2f4650"/>

  <!-- ================= БЛИЖНЯЯ НОГА ================= -->
  <path d="M404 332c5 27 9 46 19 60 8 11 14 20 18 30" fill="none" stroke="#f0a13c" stroke-width="13" stroke-linecap="round"/>
  <path d="M443 422c12 13 22 27 26 40 3 10 4 20 4 28" fill="none" stroke="#f0a13c" stroke-width="11" stroke-linecap="round"/>
  <path d="M406 334c4 26 8 44 18 58" fill="none" stroke="#d9862a" stroke-width="4" stroke-linecap="round" opacity="0.4"/>
  <!-- перепончатая лапа на педали -->
  <path d="M462 500c10-6 26-5 34 1l10 8c3 2 2 6-2 7l-14 3c-9 2-19 1-24-4-5-6-9-11-4-15z" fill="#f0a13c" stroke="#d9862a" stroke-width="2.5"/>
  <path d="M482 502l1 12M494 498l3 13M504 504l1 11" fill="none" stroke="#d9862a" stroke-width="3" stroke-linecap="round" opacity="0.85"/>

  <!-- ================= ШАРФ ================= -->
  <path d="M452 236c-26 10-58 22-92 16-16-3-26 2-30 12 18 10 42 12 64 6 26-8 46-18 58-22z" fill="#e8604c"/>
  <path d="M366 258c-14 12-22 30-22 46 10-8 20-16 30-20-4-8-6-17-8-26z" fill="#cf4c3a"/>
  <path d="M452 236c8-8 12-18 14-28-14 6-26 12-38 16" fill="#f07a63"/>
  <path d="M444 226c-14 8-28 14-44 16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.3"/>

  <!-- блеск -->
  <path d="M356 268c10-8 26-12 40-13" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.7"/>
</svg>
